<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />

    <!-- SEO -->
    <title>Works of ART Hair Salon | Los Feliz, Los Angeles Hair Salon Since 2001</title>
    <meta
      name="description"
      content="Works of ART Hair Salon — Los Feliz's best hair salon since 2001. Award-winning stylists for cuts, color, balayage, men's cuts and creative hair on Hollywood Blvd."
    />
    <meta name="author" content="Works of ART Hair Salon" />

    <!-- Open Graph -->
    <meta property="og:type" content="business.business" />
    <meta property="og:title" content="Works of ART Hair Salon | Los Feliz Since 2001" />
    <meta
      property="og:description"
      content="An art gallery meets a high-end neighborhood salon in the heart of Los Feliz. Cuts, color, balayage and creative hair."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Works of ART Hair Salon" />
    <meta property="business:contact_data:locality" content="Los Angeles" />
    <meta property="business:contact_data:region" content="CA" />
    <meta property="business:contact_data:postal_code" content="90027" />
    <meta property="business:contact_data:country_name" content="USA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Works of ART Hair Salon | Los Feliz Since 2001" />
    <meta
      name="twitter:description"
      content="An art gallery meets a high-end neighborhood salon in the heart of Los Feliz."
    />

    <!-- LocalBusiness JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Works of ART Hair Salon",
        "image": "/images/hero-interior.jpg",
        "@id": "https://worksofarthair.com",
        "url": "https://worksofarthair.com",
        "telephone": "+1-323-667-0072",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "4655 1/2 Hollywood Blvd",
          "addressLocality": "Los Angeles",
          "addressRegion": "CA",
          "postalCode": "90027",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "10:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "17:00"
          }
        ],
        "paymentAccepted": "Visa, American Express, Discover, Mastercard",
        "currenciesAccepted": "USD",
        "sameAs": [
          "https://www.instagram.com/worksofarthair",
          "https://www.facebook.com/worksofarthair"
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
